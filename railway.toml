[build]
builder = "nixpacks"

[deploy]
startCommand = "npm run start"
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

# Health check configuration
healthcheckPath = "/api/health"
healthcheckTimeout = 100

# No [[cron]] blocks here: Railway has no such config key, so the two that used
# to sit here were silently ignored. Railway's own cron is a per-service
# `cronSchedule` that re-runs the start command and expects it to exit — not
# something a web server can use.
#
# What actually drives the background work is an external scheduler POSTing
# /api/cron/process-reminders every couple of minutes (see RAILWAY_CRON_SETUP.md,
# "External Cron Service"). That route runs the WebinarJam attendance sync too
# (lib/webinarjamSync), which pushes attendance on to Emaan, so nothing else
# needs scheduling. /api/cron/sync-webinarjam remains as the dashboard's
# manual "Sync" trigger and runs the same shared implementation.
